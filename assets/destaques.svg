<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="6 locais de estoque, 3 perfis de acesso, 1 rastro por peça, 0 etapas de build">
<defs><linearGradient id="y" x1="0" x2="1"><stop offset="0" stop-color="#F5C518"/><stop offset="1" stop-color="#FFE082"/></linearGradient>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#F5C518" stop-opacity="0"/><stop offset=".5" stop-color="#F5C518"/><stop offset="1" stop-color="#F5C518" stop-opacity="0"/></linearGradient>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161616" stroke-width="1"/></pattern>
<clipPath id="card"><rect width="1200" height="200" rx="18"/></clipPath></defs>
<g clip-path="url(#card)"><rect width="1200" height="200" fill="#0a0a0a"/><rect width="1200" height="200" fill="url(#g)"/>
<g><animate attributeName="opacity" values="1;.55;1;1" keyTimes="0;.12;.3;1" dur="6s" begin="0.0s" repeatCount="indefinite"/>
<text x="150" y="98" text-anchor="middle" font-family="'Outfit','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#y)">6</text></g>
<text x="150" y="126" text-anchor="middle" font-family="'Outfit','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">locais de estoque</text>
<text x="150" y="148" text-anchor="middle" font-family="'Outfit','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="14" fill="#8a8a8a">Central + 5 lojas</text>
<line x1="300" x2="300" y1="40" y2="146" stroke="#242424" stroke-width="2"/>
<g><animate attributeName="opacity" values="1;.55;1;1" keyTimes="0;.12;.3;1" dur="6s" begin="0.9s" repeatCount="indefinite"/>
<text x="450" y="98" text-anchor="middle" font-family="'Outfit','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#y)">3</text></g>
<text x="450" y="126" text-anchor="middle" font-family="'Outfit','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">perfis de acesso</text>
<text x="450" y="148" text-anchor="middle" font-family="'Outfit','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="14" fill="#8a8a8a">admin · funcionário · técnico</text>
<line x1="600" x2="600" y1="40" y2="146" stroke="#242424" stroke-width="2"/>
<g><animate attributeName="opacity" values="1;.55;1;1" keyTimes="0;.12;.3;1" dur="6s" begin="1.8s" repeatCount="indefinite"/>
<text x="750" y="98" text-anchor="middle" font-family="'Outfit','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#y)">1</text></g>
<text x="750" y="126" text-anchor="middle" font-family="'Outfit','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">rastro por peça</text>
<text x="750" y="148" text-anchor="middle" font-family="'Outfit','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="14" fill="#8a8a8a">quem mexeu, quando e por quê</text>
<line x1="900" x2="900" y1="40" y2="146" stroke="#242424" stroke-width="2"/>
<g><animate attributeName="opacity" values="1;.55;1;1" keyTimes="0;.12;.3;1" dur="6s" begin="2.7s" repeatCount="indefinite"/>
<text x="1050" y="98" text-anchor="middle" font-family="'Outfit','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#y)">0</text></g>
<text x="1050" y="126" text-anchor="middle" font-family="'Outfit','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">etapas de build</text>
<text x="1050" y="148" text-anchor="middle" font-family="'Outfit','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="14" fill="#8a8a8a">HTML · CSS · JS puros</text>
<rect x="0" y="186" width="1200" height="3" fill="#1a1a1a"/>
<rect x="-300" y="186" width="300" height="3" fill="url(#sw)"><animate attributeName="x" from="-300" to="1200" dur="5s" repeatCount="indefinite"/></rect>
</g></svg>
